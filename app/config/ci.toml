# Overrides of base.toml for ENVIRONMENT=ci, key by key.
# Never put a secret here: secrets come from the environment as <SLICE>__<FIELD>.

[notify_api_key_leak]
channel_id = "C033L7RGCT0"
oncall_group_id = ""

[atip]
announce_channel_id = "C033L7RGCT0"

[plugins.incident_response]
# A plugin that declares a requirement is off: ci configures no vendor tenant or token
# (decisions/plugins.md); a guard test fails if one is left on.
"incident.scribe" = false
oncall_sync = false
user_rotations = false

[plugins.workplace_utilities]
rant = false
