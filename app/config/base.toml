# Defaults for every settings slice, one table per slice (decisions/configuration.md).
# Secure and production-shaped; an environment file overrides it key by key.
# Never put a secret here: secrets come from the environment as <SLICE>__<FIELD>.

[logging]
log_level = "INFO"
redaction_extra_keys = []

[server]
public_base_url = "http://127.0.0.1:8000"
sre_test_channel_id = ""
webhook_max_body_bytes = 262144

[security]
# Trusted JWT issuers: one [[security.issuers]] entry each, with issuer,
# jwks_uri (https), algorithms (asymmetric) and audience. None by default.
issuers = []
cors_allowed_origins = []
cors_allowed_methods = ["GET", "POST"]
cors_allowed_headers = ["Authorization", "Content-Type", "X-Request-ID", "traceparent"]
# The dev bypass is for local development only: a developer opts in with
# SECURITY__DEV_BYPASS_ENABLED and SECURITY__DEV_BYPASS_TOKEN in app/.env.
dev_bypass_enabled = false

[slack_transport]
# Each deployment that runs Slack switches the transport on in its own file.
enabled = false
# Socket Mode needs no inbound exposure; false selects HTTP Events mode, which needs SLACK_SIGNING_SECRET.
socket_mode = true
command_prefix = ""

[notify_api_key_leak]
channel_id = ""
oncall_group_id = ""
