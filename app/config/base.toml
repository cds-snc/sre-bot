# Defaults for every settings slice, one table per slice (decisions/configuration.md).
# Secure and production-shaped; an environment file overrides it key by key.
# Never put a secret here: secrets come from the environment as <SLICE>__<FIELD>.

[logging]
log_level = "INFO"
redaction_extra_keys = []

[server]
public_base_url = "http://127.0.0.1:8000"
sre_test_channel_id = ""
webhook_max_body_bytes = 262144

[security]
# Trusted JWT issuers: one [[security.issuers]] entry each, with issuer,
# jwks_uri (https), algorithms (asymmetric) and audience. None by default.
issuers = []
cors_allowed_origins = []
cors_allowed_methods = ["GET", "POST"]
cors_allowed_headers = ["Authorization", "Content-Type", "X-Request-ID", "traceparent"]
# The dev bypass is for local development only: a developer opts in with
# SECURITY__DEV_BYPASS_ENABLED and SECURITY__DEV_BYPASS_TOKEN in app/.env.
dev_bypass_enabled = false

[slack]
# The Slack client's per-call timeout, retry budget and error-code catalogues.
# Each deployment that works with a workspace names it in [slack.tenant] team_id in
# its own file; the tokens come from the environment as SLACK__<FIELD>.
request_timeout_seconds = 10
retry_max_attempts = 2
transient_retry_after_seconds = 30
unauthorized_errors = [
    "not_authed",
    "invalid_auth",
    "account_inactive",
    "token_revoked",
    "token_expired",
    "missing_scope",
    "no_permission",
    "not_allowed_token_type",
    "access_denied",
    "permission_denied",
    "ekm_access_denied",
    "team_access_not_granted",
]
not_found_errors = ["channel_not_found", "user_not_found", "users_not_found", "message_not_found", "no_such_subteam"]
transient_errors = ["ratelimited", "internal_error", "fatal_error", "service_unavailable", "request_timeout"]

[slack_transport]
# Each deployment that runs Slack switches the transport on in its own file.
enabled = false
# Socket Mode needs no inbound exposure; false selects HTTP Events mode, which needs SLACK__SIGNING_SECRET.
socket_mode = true
command_prefix = ""

[notify_api_key_leak]
channel_id = ""
oncall_group_id = ""

# Plugin enablement (decisions/plugins.md): one table per product area
# (decisions/product-scope.md), one key per entry point, named as in
# pyproject.toml. Boot fails when an installed entry point has no key, a key
# names no entry point, or a name sits under two areas. A disabled plugin is
# never imported. An environment file overrides a key; a developer can switch
# one on from app/.env, for example PLUGINS__PLATFORM_ACCESS='{"access.sync": true}'.

[plugins.incident_response]
"incident.comms" = true
"incident.scribe" = true
oncall_sync = true
user_rotations = true

[plugins.cloud_operations]
# No plugin yet: the AWS surfaces are still legacy modules (TASK-88).

[plugins.platform_access]
# Off everywhere, as production runs them today (TASK-112.3 deletes their ACCESS_*_ENABLED switches).
"access.catalog" = false
"access.request" = false
"access.sync" = false

[plugins.workplace_utilities]
geolocate = true
rant = true
