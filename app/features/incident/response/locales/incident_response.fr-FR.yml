  declare.post.on_call_unavailable: "Personne de garde n'a été invité : ce produit n'a pas d'horaire de garde, ou le service de garde n'a pas pu être joint."
  declare.post.next_steps: "🚨 *Ressources de l'incident créées avec succès!*\n*Prochaines étapes - Commandes disponibles :*\n• `/sre incident roles manage` - Attribuer les rôles de l'incident\n• `/sre incident schedule retro` - Planifier une rencontre rétrospective\n• `/sre incident close` - Fermer et archiver cet incident\n• `/sre incident status update <status>` - Mettre à jour le statut de l'incident\n• `/sre incident status-update` - Rédiger, réviser et approuver une mise à jour publique\n• `/sre incident show` - Voir les détails de l'incident\n• `/sre incident summarize` - Résumer le canal pour mettre à jour une personne qui se joint à l'incident (ajoutez `--since 30m` ou `--since 2h` pour limiter la période)\n• `/sre incident draft` - Rédiger un rapport d'incident à partir de ce canal dans un nouveau document, prêt à réviser\n\n*Actions rapides :*\n📋 Utilisez le rapport d'incident en signet ci-dessus pour documenter vos constats\n👥 Attribuez des rôles aux membres de l'équipe pour clarifier les responsabilités\n📅 Planifiez une rencontre rétrospective lorsque vous êtes prêts\n\n_Tapez_ `/sre incident help` _pour la liste complète des commandes_"
