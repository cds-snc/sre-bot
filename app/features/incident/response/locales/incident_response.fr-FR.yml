incident_response:
  status.description: "Changer le statut de cet incident."
  status.examples.default: "`/sre incident status update Closed` - Fermer cet incident."
  status.update.description: "Définir le statut de cet incident : In Progress, Open, Ready to be Reviewed, Reviewed ou Closed."
  status.update.examples.default: "`/sre incident status update Ready to be Reviewed` - Indiquer que cet incident est prêt pour sa revue."
  status.help: "`/sre incident status update <statut>` change le statut de cet incident.\n*Statuts valides :* {statuses}"
  status.bare_status: "Utilisez `/sre incident status update {status}` pour changer le statut."
  status.missing: "Veuillez indiquer un statut."
  status.invalid: "Utilisez un statut valide avec cette commande :\n{statuses}"
  status.notice: "{user} a changé le statut de l'incident à {status}."
  status.updated: "Le statut de l'incident est maintenant {status}."
  status.not_an_incident: "Ce canal n'est pas un canal d'incident; il n'a donc aucun statut à changer."
  status.ambiguous: "Plusieurs incidents utilisent ce canal; je ne peux donc pas savoir duquel changer le statut."
  status.conflict: "L'incident a changé pendant la mise à jour de son statut. Veuillez réessayer."
  status.unreadable: "Le dossier de cet incident est illisible; son statut n'a donc pas été changé."
  status.unavailable: "La base de données des incidents est temporairement indisponible. Veuillez réessayer plus tard."
  status.report_skipped: "L'incident n'a pas de rapport; aucune ligne de statut n'a donc été changée dans un rapport."
  status.report_failed: "Impossible de mettre à jour la ligne de statut du rapport d'incident."
  status.projection_failed: "Impossible de mettre à jour le statut dans la liste des incidents."
  status.channel_skipped: "Impossible d'écrire dans le canal de l'incident; rien n'y a donc été publié."
  status.channel_failed: "Impossible de publier le changement de statut dans le canal de l'incident."
