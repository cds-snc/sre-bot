  declare.success.next_steps_instructions: "Posez-vous ces questions:"
  declare.success.brief_up: "S'agit-il d'un `incident de cybersécurité` (fuite de secrets/données, comptes compromis, attaque) ?\nVeuillez lancer le processus de breffage pour le Centre canadien pour la cybersécurité (CCC) et le Bureau du dirigeant principal de l'information du SCT.\nCela veut simplement dire que nous enverrons un résumé de l'incident (ou les conclusions préliminaires et les mises à jour si l'incident est toujours en cours) à cyberincident@cyber.gc.ca, avec zztbscybers@tbs-sct.gc.ca en CC, et à security@cds-snc.ca! Le CCC nous assignera un numéro de dossier et nous demandera plus de détails si nécessaire."
