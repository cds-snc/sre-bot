incident_response:
  status.description: "Change this incident's status."
  status.examples.default: "`/sre incident status update Closed` - Close this incident."
  status.update.description: "Set this incident's status: In Progress, Open, Ready to be Reviewed, Reviewed or Closed."
  status.update.examples.default: "`/sre incident status update Ready to be Reviewed` - Mark this incident ready for its review."
  status.help: "`/sre incident status update <status>` changes this incident's status.\n*Valid statuses:* {statuses}"
  status.bare_status: "Use `/sre incident status update {status}` to change the status."
  status.missing: "Please provide a status to update."
  status.invalid: "A valid status must be used with this command:\n{statuses}"
  status.notice: "{user} has updated the incident status to {status}."
  status.updated: "The incident status is now {status}."
  status.not_an_incident: "This channel is not an incident channel, so it has no status to change."
  status.ambiguous: "More than one incident uses this channel, so I can't tell whose status to change."
  status.conflict: "The incident changed while its status was being updated. Please try again."
  status.unreadable: "This incident's record can't be read, so its status was not changed."
  status.unavailable: "The incidents database is temporarily unavailable. Please try again later."
  status.report_skipped: "The incident has no report, so no report status line was changed."
  status.report_failed: "Couldn't update the status line of the incident report."
  status.projection_failed: "Couldn't update the status in the incident list."
  status.channel_skipped: "The incident channel can't be written to, so nothing was posted there."
  status.channel_failed: "Couldn't post the status change to the incident channel."
