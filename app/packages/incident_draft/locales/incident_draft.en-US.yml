incident_draft:
  description: "Draft a filled-in copy of the incident document using this channel's history."
  examples.default: "`/sre incident draft` - Answer each section of the incident report from the channel history."
  examples.limit: "`/sre incident draft --limit 200` - Draft from at most 200 channel messages."
  result.header: "\U0001F4DD Created a <{{url}}|draft incident report> — please review and edit it:"
  result.header_updated: "\U0001F4DD Refreshed the <{{url}}|draft incident report> — please review and edit it:"
  result.timeline_updated: "\U0001F552 The incident report's timeline section has been replaced with the AI timeline."
  result.unanswered: "The channel history didn't cover these — they keep the template's instructions:"
  result.no_document: "I couldn't find an incident document bookmarked in this channel."
  result.unreadable: "I couldn't read any sections from the incident document."
  result.empty_history: "There's no channel history to draft from yet."
  result.truncated: "⚠️ The AI response was cut off before it finished, so nothing was written — your existing draft and the report's timeline are unchanged. Try again, or raise INCIDENT_DRAFT__MAX_OUTPUT_TOKENS if it keeps happening."
  result.no_answers: "The channel history didn't answer any of the document's sections, so no draft was created."
  result.error: "❌ Couldn't create the draft document right now. Please try again shortly."
