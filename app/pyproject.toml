[project]
name = "sre-bot"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "arrow>=1.4.0",
    "Authlib>=1.6.8",
    "aws-sns-message-validator>=0.0.5",
    "blinker>=1.9.0",
    "boto3>=1.42.54",
    "botocore>=1.42.54",
    "fastapi>=0.133.1",
    "geoip2>=4.8.1",
    "google-api-python-client>=2.190.0",
    "google-auth-httplib2>=0.3.0",
    "google-auth-oauthlib>=0.8.0",
    "google-api-core>=2.30.0",
    "google-auth>=2.48.0",
    "httpx>=0.28.1",
    "pandas>=2.3.3",
    "pluggy>=1.6.0",
    "pydantic-settings>=2.13.1",
    "PyJWT>=2.12.0",
    "PyYAML!=6.0.0,!=5.4.0,!=5.4.1",
    "python-dotenv>=1.2.2",
    "python-i18n>=0.3.9",
    "pytz>=2023.4",
    "requests>=2.32.5",
    "slowapi>=0.1.9",
    "schedule>=1.2.2",
    "slack-bolt>=1.27.0",
    "structlog>=25.5.0",
    "trello>=0.9.7.3",
    "uvicorn>=0.41.0",
    "email-validator>=2.3.0",
]

[tool.ruff]
target-version = "py314"
line-length = 130
exclude = [
    "venv*",
    "__pycache__",
    "node_modules",
    "cache",
    "migrations",
    "build",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "S"]
ignore = ["E501"]
mccabe.max-complexity = 16

# Declared explicitly so import classification does not depend on directory
# existence, which ruff's cache key does not track.
[tool.ruff.lint.isort]
known-first-party = [
    "api",
    "bin",
    "capabilities",
    "contracts",
    "features",
    "infrastructure",
    "integrations",
    "jobs",
    "main",
    "models",
    "modules",
    "packages",
    "server",
    "tests",
    "utils",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "B007", "B008", "B011", "B017", "B018", "B905", "C408", "C416", "C418", "SIM116", "SIM117", "SIM118", "UP028"]
"utils/tests.py" = ["S101"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
exclude = ["^tests/"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["google.oauth2.service_account", "googleapiclient.*", "google_auth_httplib2"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["yaml", "pandas.*", "requests", "pytz", "sns_message_validator"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
log_cli = false
log_cli_level = "WARNING"
log_level = "WARNING"
markers = [
    "unit: Pure unit tests with no external dependencies",
    "integration: Integration tests combining multiple components",
    "legacy: Legacy test structure maintained for transition period",
    "smoke: Smoke tests that exercise live or sandbox external systems; excluded from default runs"
]
env = [
    # Feature warmups must not depend on the developer's .env: tests that need a
    # feature enable it explicitly. ACCESS_SYNC_ENABLED=true would make lifespan
    # build the AWS Identity Center adapter (and assume its role) at startup.
    "ACCESS_SYNC_ENABLED=false",
    "SLACK_ENABLED=false",
    "SLACK_TOKEN=xoxb-test-token-for-tests",
    "SLACK_BOT_TOKEN=xoxb-test-token-for-tests",
    "SLACK_APP_TOKEN=xapp-test-token",
    "SLACK_SIGNING_SECRET=test-signing-secret",
    "APP_TOKEN=APP_TOKEN",
    "SRE_DRIVE_ID=SRE_DRIVE_ID",
    "SRE_INCIDENT_FOLDER=SRE_INCIDENT_FOLDER",
    "INCIDENT_TEMPLATE=INCIDENT_TEMPLATE",
    "INCIDENT_LIST=INCIDENT_LIST",
    "ISSUER_CONFIG='test-issuer-config'",
    "PICKLE_STRING=PICKLE_STRING",
    "SENTINEL_CUSTOMER_ID=SENTINEL_CUSTOMER_ID",
    "SENTINEL_LOG_TYPE=SENTINEL_LOG_TYPE",
    "SENTINEL_SHARED_KEY=SENTINEL_SHARED_KEY",
    "NOTIFY_OPS_CHANNEL_ID=C1234567890",
    "NOTIFY_SRE_USER_NAME=NOTIFY_SRE_USER_NAME",
    "NOTIFY_SRE_CLIENT_SECRET=NOTIFY_SRE_CLIENT_SECRET",
    "SLACK_SECURITY_USER_GROUP_ID=SLACK_SECURITY_USER_GROUP_ID",
    "SLACK_NOTIFY_MGMT_USER_GROUP_ID=SLACK_NOTIFY_MGMT_USER_GROUP_ID",
    "INCIDENT_HANDBOOK_URL=INCIDENT_HANDBOOK_URL",
    "AWS_ORG_ACCOUNT_ROLE_ARN=AWS_ORG_ACCOUNT_ROLE_ARN",
    "AWS_LOGGING_ACCOUNT_ROLE_ARN=AWS_LOGGING_ACCOUNT_ROLE_ARN",
    "AWS_AUDIT_ACCOUNT_ROLE_ARN=AWS_AUDIT_ACCOUNT_ROLE_ARN",
    "ATIP_ANNOUNCE_CHANNEL=ATIP_ANNOUNCE_CHANNEL",
    "TRELLO_APP_KEY=TRELLO_APP_KEY",
    "TRELLO_TOKEN=TRELLO_TOKEN",
    "TRELLO_ATIP_BOARD=TRELLO_ATIP_BOARD",
    "GCP_SRE_SERVICE_ACCOUNT_KEY_FILE=GCP_SRE_SERVICE_ACCOUNT_KEY_FILE",
    "SLACK__SLACK_TOKEN=xoxb-test-token-for-tests",
    "SLACK__APP_TOKEN=xapp-test-token",
    "AWS__AWS_REGION=us-east-1",
    "SENTINEL__SENTINEL_CUSTOMER_ID=SENTINEL_CUSTOMER_ID",
    "SENTINEL__SENTINEL_LOG_TYPE=SENTINEL_LOG_TYPE",
    "SENTINEL__SENTINEL_SHARED_KEY=SENTINEL_SHARED_KEY",
    "SLACK__SLACK_SECURITY_USER_GROUP_ID=SLACK_SECURITY_USER_GROUP_ID",
    "AWS__ORG_ROLE_ARN=AWS_ORG_ACCOUNT_ROLE_ARN",
    "AWS__LOGGING_ROLE_ARN=AWS_LOGGING_ACCOUNT_ROLE_ARN",
    "AWS__AUDIT_ROLE_ARN=AWS_AUDIT_ACCOUNT_ROLE_ARN",
    "ATIP__ATIP_ANNOUNCE_CHANNEL=ATIP_ANNOUNCE_CHANNEL",
    "TRELLO__TRELLO_APP_KEY=TRELLO_APP_KEY",
    "TRELLO__TRELLO_TOKEN=TRELLO_TOKEN",
    "TRELLO__TRELLO_ATIP_BOARD=TRELLO_ATIP_BOARD",
    "GOOGLE_WORKSPACE__GCP_SRE_SERVICE_ACCOUNT_KEY_FILE=GCP_SRE_SERVICE_ACCOUNT_KEY_FILE",
    "GROUP_PROVIDERS={{\"google\": {{\"enabled\": true, \"primary\": true}}}}",
]
norecursedirs = ["tests/smoke"]
filterwarnings = [
    "ignore::DeprecationWarning:pydantic._internal._config",
]

[tool.coverage.run]
source = ["./"]
omit = ["./tests/*"]

[tool.coverage.html]
directory = "coverage_html_report"

[tool.coverage.report]
exclude_lines = ["if __name__ == .__main__.:"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff==0.15.7",
    "mypy==1.19.1",
    "pytest==8.4.2",
    "pytest-asyncio==0.26.0",
    "pytest-env==0.8.2",
    "coverage==6.5.0",
    "pytest-cov==4.1.0",
    "freezegun==1.5.5",
    "requests-mock==1.12.1",
    "checkov",
    "setuptools==78.1.1",
    "moto[dynamodb]>=5.2.2",
    "types-boto3[ce,config,dynamodb,guardduty,identitystore,lambda,organizations,securityhub,sqs,sso-admin,sts]>=1.43.63",
    "google-api-python-client-stubs>=1.39.0",
    "import-linter>=2.15",
]

[tool.hatch.build.targets.wheel]
packages = ["api", "contracts", "infrastructure", "integrations", "jobs", "models", "modules", "packages", "server", "utils"]

[tool.importlinter]
# Enforces decisions/plugin-architecture.md (six layers) with the transitional
# packages from decisions/migration.md. features and capabilities are listed as
# optional layers; add each to root_packages in the PR that creates it
# (import-linter rejects a root package that does not exist).
root_packages = ["server", "packages", "infrastructure", "integrations", "modules", "api", "jobs", "models", "utils", "contracts"]

[[tool.importlinter.contracts]]
id = "layers"
name = "(a) Six-layer plugin architecture"
type = "layers"
layers = [
    "server",
    "(modules) : (api) : (jobs)",
    "(features) | packages",
    "(capabilities)",
    "infrastructure",
    "integrations",
    "contracts",
]
unmatched_ignore_imports_alerting = "error"
ignore_imports = [
    # Existing violations, seeded 2026-09-28 by TASK-18 (decisions/plugin-architecture.md Migration and decisions/outbound-clients.md Migration).
    # Shrink-only: remove an entry when its import is fixed; never add one.
    "integrations.google_workspace.client -> infrastructure.configuration.integrations.google",
    "integrations.maxmind.client -> infrastructure.configuration.integrations.maxmind",
    "integrations.notify.client -> infrastructure.configuration.app",
    "integrations.notify.client -> infrastructure.configuration.integrations.notify",
    "integrations.opsgenie.client -> infrastructure.configuration.integrations.opsgenie",
    "integrations.sentinel.client -> infrastructure.audit.models",
    "integrations.sentinel.client -> infrastructure.configuration.integrations.sentinel",
    "integrations.slack.formatter -> infrastructure.i18n",
    "integrations.slack.provider -> infrastructure.i18n",
    "integrations.slack.provider -> infrastructure.slack.settings",
    "integrations.trello.client -> infrastructure.configuration.integrations.trello",
]

[[tool.importlinter.contracts]]
id = "no-host-imports"
name = "(b) Packages, features and capabilities never import infrastructure or server"
type = "forbidden"
source_modules = ["packages"]
forbidden_modules = ["infrastructure", "server"]
# Direct imports only: chains through integrations are tracked by contract (d).
allow_indirect_imports = true
unmatched_ignore_imports_alerting = "error"
ignore_imports = [
    # Existing violations, seeded 2026-09-28 by TASK-18 (decisions/plugin-architecture.md Migration).
    # Shrink-only: remove an entry when its import is fixed; never add one.
    "packages.access.catalog -> infrastructure.plugins",
    "packages.access.catalog.interactions.http -> infrastructure.security",
    "packages.access.catalog.interactions.http -> infrastructure.security.models",
    "packages.access.catalog.providers -> infrastructure.directory",
    "packages.access.catalog.service -> infrastructure.directory.provider",
    "packages.access.common.group_policy -> infrastructure.directory.models",
    "packages.access.request -> infrastructure.events",
    "packages.access.request -> infrastructure.plugins",
    "packages.access.request.interactions.http -> infrastructure.security",
    "packages.access.request.interactions.http -> infrastructure.security.models",
    "packages.access.request.policies -> infrastructure.directory.models",
    "packages.access.request.policies -> infrastructure.directory.provider",
    "packages.access.request.providers -> infrastructure.directory",
    "packages.access.request.providers -> infrastructure.events",
    "packages.access.request.providers -> infrastructure.storage",
    "packages.access.request.service -> infrastructure.directory.models",
    "packages.access.request.service -> infrastructure.directory.provider",
    "packages.access.request.service -> infrastructure.events",
    "packages.access.request.store -> infrastructure.storage.protocol",
    "packages.access.sync -> infrastructure.events",
    "packages.access.sync -> infrastructure.i18n.resources",
    "packages.access.sync -> infrastructure.plugins",
    "packages.access.sync.application -> infrastructure.events",
    "packages.access.sync.desired_state -> infrastructure.directory.provider",
    "packages.access.sync.interactions.http -> infrastructure.security",
    "packages.access.sync.interactions.http -> infrastructure.security.models",
    "packages.access.sync.interactions.ingress -> infrastructure.idempotency",
    "packages.access.sync.interactions.slack -> infrastructure.i18n",
    "packages.access.sync.job_runner -> infrastructure.idempotency",
    "packages.access.sync.job_status_store -> infrastructure.storage",
    "packages.access.sync.platform_lock -> infrastructure.idempotency",
    "packages.access.sync.presenters -> infrastructure.i18n",
    "packages.access.sync.providers -> infrastructure.directory",
    "packages.access.sync.providers -> infrastructure.events",
    "packages.access.sync.providers -> infrastructure.idempotency",
    "packages.access.sync.providers -> infrastructure.storage",
    "packages.access.sync.store -> infrastructure.storage.protocol",
    "packages.geolocate -> infrastructure.i18n.resources",
    "packages.geolocate -> infrastructure.plugins",
    "packages.geolocate.platforms.slack -> infrastructure.i18n",
    "packages.incident.drive.adapters.google_drive -> infrastructure.configuration.integrations.google",
    "packages.incident.drive.adapters.google_drive -> infrastructure.drive",
    "packages.incident.drive.adapters.google_drive -> infrastructure.drive.factory",
    "packages.incident.drive.adapters.google_drive -> infrastructure.drive.models",
    "packages.incident_draft -> infrastructure.i18n.resources",
    "packages.incident_draft -> infrastructure.plugins",
    "packages.incident_draft.adapters.google_docs -> infrastructure.configuration.integrations.google",
    "packages.incident_draft.adapters.google_docs -> infrastructure.drive",
    "packages.incident_draft.platforms.slack -> infrastructure.i18n",
    "packages.incident_summary -> infrastructure.i18n.resources",
    "packages.incident_summary -> infrastructure.plugins",
    "packages.incident_summary.platforms.slack -> infrastructure.i18n",
    "packages.oncall_sync -> infrastructure.plugins",
    "packages.rant -> infrastructure.plugins",
    "packages.talent.adapters.google_drive -> infrastructure.configuration.integrations.google",
    "packages.talent.adapters.google_drive -> infrastructure.drive.factory",
    "packages.user_rotations -> infrastructure.plugins",
]

[[tool.importlinter.contracts]]
id = "contracts-leaf"
name = "(c) contracts imports nothing else from the app"
type = "forbidden"
source_modules = ["contracts"]
forbidden_modules = ["server", "packages", "infrastructure", "integrations", "modules", "api", "jobs", "models", "utils"]

[[tool.importlinter.contracts]]
id = "integrations-leaf"
name = "(d) integrations imports nothing from the app except contracts"
type = "forbidden"
source_modules = ["integrations"]
forbidden_modules = ["server", "packages", "infrastructure", "modules", "api", "jobs", "models", "utils"]
unmatched_ignore_imports_alerting = "error"
ignore_imports = [
    # Existing violations, seeded 2026-09-28 by TASK-18 (decisions/outbound-clients.md Migration).
    # Shrink-only: remove an entry when its import is fixed; never add one.
    "integrations.google_workspace.client -> infrastructure.configuration.integrations.google",
    "integrations.maxmind.client -> infrastructure.configuration.integrations.maxmind",
    "integrations.notify.client -> infrastructure.configuration.app",
    "integrations.notify.client -> infrastructure.configuration.integrations.notify",
    "integrations.opsgenie.client -> infrastructure.configuration.integrations.opsgenie",
    "integrations.sentinel.client -> infrastructure.audit.models",
    "integrations.sentinel.client -> infrastructure.configuration.integrations.sentinel",
    "integrations.slack.formatter -> infrastructure.i18n",
    "integrations.slack.provider -> infrastructure.i18n",
    "integrations.slack.provider -> infrastructure.slack.settings",
    "integrations.trello.client -> infrastructure.configuration.integrations.trello",
]

[[tool.importlinter.contracts]]
id = "integrations-via-adapters"
name = "(e) packages import integrations only from adapters/ modules"
type = "forbidden"
source_modules = ["packages"]
forbidden_modules = ["integrations"]
# Direct imports only: chains through infrastructure are tracked by contracts (a) and (b).
allow_indirect_imports = true
unmatched_ignore_imports_alerting = "error"
ignore_imports = [
    # Permanent: adapters/ is where a package may import integrations (decisions/outbound-clients.md).
    "packages.**.adapters.** -> integrations.**",
    # Existing violations, seeded 2026-09-28 by TASK-18 (decisions/outbound-clients.md Migration).
    # Shrink-only: remove an entry when its import is fixed; never add one.
    "packages.incident_draft.service -> integrations.openai",
    "packages.incident_summary.service -> integrations.openai",
]

[[tool.importlinter.contracts]]
id = "feature-independence"
name = "(f) Top-level packages are independent of each other"
type = "independence"
modules = [
    "packages.access",
    "packages.aws_platform",
    "packages.geolocate",
    "packages.incident",
    "packages.incident_draft",
    "packages.incident_summary",
    "packages.oncall_sync",
    "packages.rant",
    "packages.talent",
    "packages.user_rotations",
]
unmatched_ignore_imports_alerting = "error"
ignore_imports = [
    # Existing violations, seeded 2026-09-28 by TASK-18 (decisions/feature-packages.md; TASK-123 removes the oncall_sync -> user_rotations coupling).
    # Shrink-only: remove an entry when its import is fixed; never add one.
    "packages.oncall_sync -> packages.user_rotations.settings",
    "packages.oncall_sync.ports -> packages.user_rotations.service",
    "packages.oncall_sync.providers -> packages.user_rotations.providers",
]

[[tool.importlinter.contracts]]
id = "no-legacy-imports"
name = "(g) Nothing outside the legacy tree imports modules"
type = "forbidden"
source_modules = ["packages", "infrastructure", "integrations"]
forbidden_modules = ["modules"]

[[tool.importlinter.contracts]]
id = "access-umbrella"
name = "(h) Access subdomains are independent siblings over a shared kernel"
type = "layers"
containers = ["packages.access"]
layers = [
    "catalog | request | sync",
    "common",
]
exhaustive = true
